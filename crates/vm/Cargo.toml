[package]
name = "habitat-vm"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "VM launch via rootless Podman + the krun runtime (libkrun), and session lifecycle (Phase 3)."

[dependencies]
habitat-policy = { path = "../policy" }
habitat-egress = { path = "../egress" }
habitat-audit = { path = "../audit" }

# Exit-gate and adversarial tests live under the top-level tests/unit/ and
# tests/adversarial/ (mirroring the source tree, per file-structure.md)
# rather than as inline #[cfg(test)] modules, since they cover this
# crate's contract with the rest of the system rather than pure internal
# logic. These [[test]] targets point cargo at those files without
# duplicating them under crates/vm/.
[[test]]
name = "exit_gate"
path = "../../tests/unit/vm/exit_gate.rs"

[[test]]
name = "containment_escape"
path = "../../tests/adversarial/containment_escape.rs"
