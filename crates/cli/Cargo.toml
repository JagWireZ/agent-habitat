[package]
name = "habitat-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The `habitat` binary entrypoint: `habitat install` and `habitat run`."

[[bin]]
name = "habitat"
path = "src/main.rs"

[dependencies]
# Phase 1 wires up `habitat install` and `habitat run`'s preflight
# subroutine only. Phase 7 finishes assembling the real CLI, adding
# habitat-workspace, habitat-vm, and habitat-egress for the rest of
# `run`'s session lifecycle.
habitat-install = { path = "../install" }
habitat-audit = { path = "../audit" }
habitat-policy = { path = "../policy" }
