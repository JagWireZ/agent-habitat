[package]
name = "habitat-egress"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Local egress proxy enforcing a default-deny, SNI-based allowlist (Phase 5)."

[dependencies]
habitat-policy = { path = "../policy" }
habitat-audit = { path = "../audit" }

# `habitat-vm` only as a dev-dependency, for tests/adversarial/
# egress_bypass.rs below, which confirms `habitat_vm::launcher::
# build_run_args`'s output against this crate's own network_setup
# constants. Safe despite habitat-vm's own normal dependency on
# habitat-egress: dev-dependencies aren't part of the library's real
# dependency graph, only pulled in for building this crate's own test
# binaries, so this isn't a cycle.
[dev-dependencies]
habitat-vm = { path = "../vm" }

# Exit-gate and adversarial tests live under the top-level tests/unit/
# and tests/adversarial/ (mirroring the source tree, per
# file-structure.md) rather than as inline #[cfg(test)] modules, since
# they cover this crate's contract with the rest of the system rather
# than pure internal logic. These [[test]] targets point cargo at those
# files without duplicating them under crates/egress/.
[[test]]
name = "exit_gate"
path = "../../tests/unit/egress/exit_gate.rs"

[[test]]
name = "egress_bypass"
path = "../../tests/adversarial/egress_bypass.rs"
