<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#257942"/>
    </marker>
    <marker id="arrow-green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#257942"/>
    </marker>
    <style>
      .zone-title { font-size: 16px; font-weight: 700; }
      .box-title { font-size: 14px; font-weight: 700; fill: #172b3a; }
      .box-copy { font-size: 11.5px; fill: #52606d; }
      .flow-label { font-size: 11px; font-weight: 600; }
      .lane-label { font-size: 10.5px; font-weight: 700; letter-spacing: .7px; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="750" fill="#172b3a">Isolated AI coding workspace</text>
  <text x="600" y="57" text-anchor="middle" font-size="12.5" fill="#52606d">The agent works on a disposable project copy, separated from the host by a KVM microVM.</text>

  <!-- Trust zones -->
  <rect x="190" y="88" width="500" height="602" rx="14" fill="#f5f7f9" stroke="#9aa8b5" stroke-width="1.4"/>
  <rect x="730" y="88" width="440" height="602" rx="14" fill="#eef5ff" stroke="#4773ad" stroke-width="1.6"/>
  <text x="215" y="117" class="zone-title" fill="#334e68">Host computer</text>
  <text x="755" y="117" class="zone-title" fill="#24558d">Guest microVM</text>

  <!-- KVM boundary -->
  <rect x="701" y="88" width="18" height="602" fill="#e9eef3"/>
  <line x1="710" y1="88" x2="710" y2="690" stroke="#334e68" stroke-width="2" stroke-dasharray="7,5"/>
  <g transform="translate(710 190) rotate(-90)">
    <rect x="-82" y="-13" width="164" height="26" rx="13" fill="#334e68"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">KVM ISOLATION BOUNDARY</text>
  </g>

  <!-- External destination -->
  <rect x="24" y="560" width="142" height="104" rx="10" fill="#f7f8fa" stroke="#9aa8b5" stroke-width="1.2"/>
  <text x="95" y="586" text-anchor="middle" class="box-title">Internet</text>
  <text x="95" y="608" text-anchor="middle" class="box-copy">AI provider APIs</text>
  <text x="95" y="625" text-anchor="middle" class="box-copy">package registries</text>
  <text x="95" y="648" text-anchor="middle" font-size="11" font-weight="700" fill="#b42318">Everything else blocked</text>

  <!-- Lane headings -->
  <text x="215" y="151" class="lane-label" fill="#657786">VM LIFECYCLE</text>
  <line x1="215" y1="159" x2="665" y2="159" stroke="#d5dce3"/>
  <text x="215" y="322" class="lane-label" fill="#657786">PROJECT COPY</text>
  <line x1="215" y1="330" x2="665" y2="330" stroke="#d5dce3"/>
  <text x="215" y="459" class="lane-label" fill="#657786">RETURNED CHANGES</text>
  <line x1="215" y1="467" x2="665" y2="467" stroke="#d5dce3"/>
  <text x="215" y="560" class="lane-label" fill="#657786">NETWORK EGRESS</text>
  <line x1="215" y1="568" x2="665" y2="568" stroke="#d5dce3"/>

  <!-- containerd -->
  <rect x="260" y="178" width="205" height="72" rx="9" fill="#ffffff" stroke="#91a0ae"/>
  <text x="362.5" y="206" text-anchor="middle" class="box-title">containerd</text>
  <text x="362.5" y="226" text-anchor="middle" class="box-copy">launches and manages</text>
  <text x="362.5" y="242" text-anchor="middle" class="box-copy">the guest microVM</text>

  <!-- Falco as observer -->
  <rect x="490" y="264" width="175" height="50" rx="9" fill="#fffaf0" stroke="#c28b27" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="577.5" y="285" text-anchor="middle" class="box-title">Falco</text>
  <text x="577.5" y="302" text-anchor="middle" class="box-copy">observes boundary activity</text>
  <path d="M665 289 H688 Q699 289 699 300" fill="none" stroke="#a67218" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Guest agent -->
  <rect x="795" y="165" width="310" height="84" rx="9" fill="#ffffff" stroke="#4773ad" stroke-width="1.3"/>
  <text x="950" y="197" text-anchor="middle" class="box-title">AI coding agent</text>
  <text x="950" y="218" text-anchor="middle" class="box-copy">reads files, writes code, and runs tools</text>
  <text x="950" y="236" text-anchor="middle" class="box-copy">inside the isolated guest</text>

  <!-- Launch flow -->
  <path d="M465 192 H675 Q710 192 730 165 H780" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
  <rect x="568" y="175" width="74" height="20" rx="10" fill="#ffffff" stroke="#d5dce3"/>
  <text x="605" y="189" text-anchor="middle" class="flow-label" fill="#52606d">launches</text>

  <!-- Host repository -->
  <rect x="225" y="336" width="190" height="88" rx="9" fill="#ffffff" stroke="#91a0ae"/>
  <text x="320" y="366" text-anchor="middle" class="box-title">Host repository</text>
  <text x="320" y="387" text-anchor="middle" class="box-copy">real project files</text>
  <text x="320" y="404" text-anchor="middle" class="box-copy">and Git history</text>

  <!-- Sensitive-file filter -->
  <rect x="465" y="336" width="190" height="88" rx="9" fill="#fff1f0" stroke="#d6453d" stroke-width="1.3"/>
  <text x="560" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#a52a24">Sensitive-file filter</text>
  <text x="560" y="387" text-anchor="middle" font-size="11.5" fill="#a52a24">excludes keys, .env files,</text>
  <text x="560" y="404" text-anchor="middle" font-size="11.5" fill="#a52a24">credentials, and secrets</text>

  <!-- Isolated copy -->
  <rect x="795" y="336" width="310" height="88" rx="9" fill="#ffffff" stroke="#4773ad" stroke-width="1.3"/>
  <text x="950" y="366" text-anchor="middle" class="box-title">Isolated project copy</text>
  <text x="950" y="387" text-anchor="middle" class="box-copy">disposable virtual disk</text>
  <text x="950" y="404" text-anchor="middle" class="box-copy">with synthetic Git history</text>

  <!-- Filtered ingress -->
  <line x1="415" y1="380" x2="465" y2="380" stroke="#257942" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M655 380 H795" fill="none" stroke="#257942" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="665" y="365" width="120" height="21" rx="10" fill="#ffffff" stroke="#b9d7c3"/>
  <text x="725" y="380" text-anchor="middle" class="flow-label" fill="#257942">filtered files only</text>

  <!-- Agent works on isolated copy -->
  <line x1="950" y1="249" x2="950" y2="336" stroke="#52606d" stroke-width="1.6" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>
  <rect x="963" y="279" width="77" height="20" rx="10" fill="#f8fbff"/>
  <text x="1001.5" y="293" text-anchor="middle" class="flow-label" fill="#52606d">reads / edits</text>

  <!-- Human review gate -->
  <rect x="225" y="480" width="190" height="60" rx="9" fill="#fff8e8" stroke="#d39b2f" stroke-width="1.3"/>
  <text x="320" y="504" text-anchor="middle" class="box-title">Human review + apply</text>
  <text x="320" y="525" text-anchor="middle" class="box-copy">patch, commit, and push</text>

  <!-- Returned changes: isolated copy -> review -> host -->
  <path d="M795 405 H760 Q745 405 745 420 V510 H415" fill="none" stroke="#257942" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="558" y="496" width="126" height="21" rx="10" fill="#ffffff" stroke="#b9d7c3"/>
  <text x="621" y="511" text-anchor="middle" class="flow-label" fill="#257942">agent’s changes</text>
  <path d="M275 480 V448 Q275 438 285 438 H305 Q320 438 320 424" fill="none" stroke="#257942" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="339" y="450" class="flow-label" fill="#257942">approved only</text>

  <!-- Squid -->
  <rect x="415" y="590" width="240" height="70" rx="9" fill="#ffffff" stroke="#91a0ae"/>
  <text x="535" y="618" text-anchor="middle" class="box-title">Egress proxy (Squid)</text>
  <text x="535" y="639" text-anchor="middle" class="box-copy">permits allowlisted destinations only</text>

  <!-- Agent outbound network path -->
  <path d="M1105 207 H1132 Q1145 207 1145 220 V625 H655" fill="none" stroke="#52606d" stroke-width="1.7" marker-end="url(#arrow-gray)"/>
  <rect x="833" y="611" width="142" height="21" rx="10" fill="#f8fbff" stroke="#cbd8e8"/>
  <text x="904" y="626" text-anchor="middle" class="flow-label" fill="#52606d">outbound requests</text>
  <line x1="415" y1="625" x2="166" y2="625" stroke="#257942" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="254" y="611" width="105" height="21" rx="10" fill="#ffffff" stroke="#b9d7c3"/>
  <text x="306.5" y="626" text-anchor="middle" class="flow-label" fill="#257942">allowlist only</text>

  <!-- Legend and takeaway -->
  <line x1="190" y1="719" x2="222" y2="719" stroke="#257942" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="232" y="723" font-size="11" fill="#52606d">permitted data flow</text>
  <line x1="370" y1="719" x2="402" y2="719" stroke="#52606d" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="412" y="723" font-size="11" fill="#52606d">control / lifecycle</text>
  <line x1="548" y1="719" x2="580" y2="719" stroke="#a67218" stroke-width="1.7" stroke-dasharray="4,3"/>
  <text x="590" y="723" font-size="11" fill="#52606d">observes</text>
  <text x="1170" y="724" text-anchor="end" font-size="12" font-weight="600" fill="#334e68">The agent never edits the host repository directly.</text>
</svg>
